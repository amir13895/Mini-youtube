<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let L=(()=>{try{const x=localStorage.getItem('lg');if(x)return x}catch(e){}return(navigator.language||'en').toLowerCase().startsWith('fa')?'fa':'en'})();
const TT={en:{"logo": "Mini Video Hub", "nVideos": "Videos", "nMusic": "Music", "nPl": "Playlists", "nContact": "Contact", "search": "Search videos and songs", "theme": "Switch light/dark mode", "profile": "Profile", "navl": "Main navigation", "prev": "Previous", "next": "Next", "play": "Play", "pause": "Pause", "prog": "Track progress", "vprog": "Video progress", "close": "Close", "nowNone": "Nothing playing", "note": "Demo videos for now. Upload real files to enable playback.", "fh": "Work with me", "fp": "Send a collaboration or booking request. Your message is private; only the page owner can read it.", "fname": "Name", "fmail": "Email (for replies)", "fkind": "Request type", "kc": "Collaboration", "kl": "Music licensing", "kb": "Booking", "fmsg": "Message", "fsend": "Send request", "ch": "Chat", "cph": "Write a message…", "cl": "Message text", "csend": "Send", "foot2": "Available worldwide · Replies in English or Persian", "all": "All videos", "fresh": "New", "nov": "No videos found.", "non": "No songs found.", "views": "views", "guest": "Guest", "del_": "Delete", "nomsg": "No messages yet. Say hello.", "wait": "Wait a moment before sending again.", "sendfail": "Could not send (no write access).", "eName": "Enter your name.", "eMail": "Enter a valid email.", "eMsg": "Message must be at least 10 characters.", "login": "Sign in to send a request.", "sent": "Sent, thank you!", "fail": "Could not send. Try again.", "offline": "Offline mode: messages are not saved or shared."},fa:{"logo": "مینی ویدیو هاب", "nVideos": "ویدیوها", "nMusic": "موسیقی", "nPl": "پلی‌لیست‌ها", "nContact": "ارتباط با من", "search": "جستجو در ویدیوها و آهنگ‌ها", "theme": "تغییر حالت تاریک/روشن", "profile": "پروفایل", "navl": "ناوبری اصلی", "prev": "قبلی", "next": "بعدی", "play": "پخش", "pause": "توقف", "prog": "پیشرفت آهنگ", "vprog": "پیشرفت ویدیو", "close": "بستن", "nowNone": "آهنگی انتخاب نشده", "note": "این ویدیوها نمونه‌ی نمایشی‌اند؛ برای پخش واقعی فایل ویدیو را آپلود کنید.", "fh": "همکاری با من", "fp": "درخواست همکاری یا بوکینگ بفرستید. پیام شما خصوصی است و فقط صاحب صفحه می‌بیند.", "fname": "نام", "fmail": "ایمیل (برای پاسخ)", "fkind": "نوع درخواست", "kc": "همکاری", "kl": "لایسنس موسیقی", "kb": "بوکینگ", "fmsg": "پیام", "fsend": "ارسال درخواست", "ch": "چت", "cph": "پیام بنویسید…", "cl": "متن پیام", "csend": "ارسال", "foot2": "در دسترس در سراسر جهان · پاسخ به فارسی یا انگلیسی", "all": "همه ویدیوها", "fresh": "تازه‌ها", "nov": "ویدیویی پیدا نشد.", "non": "آهنگی پیدا نشد.", "views": "بازدید", "guest": "مهمان", "del_": "حذف", "nomsg": "هنوز پیامی نیست. سلام کنید.", "wait": "کمی صبر کنید و دوباره بفرستید.", "sendfail": "ارسال نشد (دسترسی نوشتن ندارید).", "eName": "نام را وارد کنید.", "eMail": "ایمیل معتبر وارد کنید.", "eMsg": "پیام حداقل ۱۰ نویسه باشد.", "login": "برای ارسال باید وارد حساب شوید.", "sent": "ارسال شد، ممنون!", "fail": "ارسال نشد، دوباره تلاش کنید.", "offline": "حالت آفلاین: پیام‌ها ذخیره یا به اشتراک گذاشته نمی‌شوند."}};
Object.assign(TT.en,{"nHome": "Home", "touch": "Get in touch", "eyebrow": "New release", "feat": "Featured", "heroDesc": "From night drives to studio sessions: the videos and music that built this channel, all in one place.", "playF": "Play feature", "browse": "Browse all", "top": "Top 6 highlights", "onscreen": "Creator on screen", "mute": "Mute music", "abT1": "Creator.", "abT2": "Composer.", "abP": "Videos, original music and playlists from a creator working with audiences and collaborators around the world."});Object.assign(TT.fa,{"nHome": "خانه", "touch": "تماس با من", "eyebrow": "تازه‌ترین انتشار", "feat": "ویژه", "heroDesc": "از رانندگی‌های شبانه تا جلسه‌های استودیو؛ ویدیوها و موسیقی‌هایی که این کانال را ساختند، همه در یک جا.", "playF": "پخش ویدیو", "browse": "مشاهده همه", "top": "۶ ویدیوی برتر", "onscreen": "سازنده روی صفحه", "mute": "بی‌صدا کردن موسیقی", "abT1": "سازنده.", "abT2": "آهنگساز.", "abP": "ویدیو، موسیقی اورجینال و پلی‌لیست از یک سازنده که با مخاطبان و همکاران سراسر جهان کار می‌کند."});
const $t=k=>(TT[L]||TT.en)[k]||TT.en[k]||k;
const fa=n=>String(n).replace(/\d/g,d=>L==='fa'?'۰۱۲۳۴۵۶۷۸۹'[d]:d);
const mmss=s=>fa(Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'));
const grad=(a,b)=>`linear-gradient(135deg,oklch(.62 .12 ${a}),oklch(.8 .1 ${b}))`;
const RV=[["Sunset over the Ridge","غروب روی تپه",12000,-2,"day",25,80,214],["Studio Session, Take 3","استودیو، برداشت سوم",4100,-1,"week",200,40,347],["City Nights Timelapse","تایم‌لپس شبانه شهر",30000,-3,"week",260,70,128],["Coffee & Sketches","قهوه و طراحی",890,-1,"month",30,60,402],["Desert Road Drive","رانندگی در جاده کویر",17000,-2,"month",60,90,265],["Rain on the Window","باران پشت پنجره",6000,-3,"month",210,50,181]];
const RT=[["Midnight Drive","رانندگی نیمه‌شب",222,220],["Low Tide","جزر کم",198,262],["Paper Lanterns","فانوس‌های کاغذی",247,294],["Slow Burn","سوختن آهسته",205,330]];
const RP=[["Night Drive","شب و جاده",[0,3]],["Slow Evenings","آرام و آهسته",[1,2]]];
const CAT=[["Landscape","منظره"],["Studio","استودیو"],["City","شهر"],["Lifestyle","سبک زندگی"],["Road","جاده"],["Mood","حال‌وهوا"]];
let VID,TR,PLS;
function build(){const f=L==='fa'?1:0,nf=new Intl.NumberFormat(L,{notation:'compact'}),rf=new Intl.RelativeTimeFormat(L,{numeric:'auto'});
 VID=RV.map((r,i)=>[r[f],nf.format(r[2])+' '+$t('views')+' · '+rf.format(r[3],r[4]),r[5],r[6],r[7],CAT[i][f]]);TR=RT.map(r=>[r[f],r[2],r[3]]);PLS=RP.map(r=>[r[f],r[2]])}
let view=['videos','music','contact'].includes(location.hash.slice(1))?location.hash.slice(1):'home',qs='',cur=-1,playing=false,el=0,tm=null,ac=null,osc=null,vi=-1,vel=0,vtm=null;
const query=()=>qs.trim().toLowerCase();

function render(){
 $('#ct').hidden=view!=='contact';
 document.querySelectorAll('nav button').forEach(b=>b.dataset.v===view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
 const q=query(),m=$('#main');let h='';
 const vids=VID.map((v,i)=>[v,i]).filter(([v])=>v[0].toLowerCase().includes(q));
 const trs=TR.map((t,i)=>[t,i]).filter(([t])=>t[0].toLowerCase().includes(q));
 const tl=l=>'<ul class="l">'+l.map(([t,i],n)=>`<li ${i===cur?'aria-current="true"':''}><button data-t="${i}">${i===cur&&playing?'<i class="eq" aria-hidden="true"><s></s><s></s><s></s></i>':`<span class="m">${fa(n+1)}</span>`}<span style="flex:1">${esc(t[0])}</span><span class="m">${mmss(t[1])}</span></button></li>`).join('')+'</ul>';
 if(view==='home'){const H=VID[2];
  h=`<section class="hero" style="--a:${H[2]};--b:${H[3]}"><div class="w"><div class="hc"><span class="eb">${$t('eyebrow')}</span><h1>${esc(H[0])}</h1><div class="chips"><span class="chip">${$t('feat')}</span><span class="m2">${esc(H[5])} • HD</span></div><p>${$t('heroDesc')}</p><div class="cta"><button class="b1" data-v="2">▶ ${$t('playF')}</button><button class="b2" data-go="videos">${$t('browse')}</button></div></div></div><button class="mute" id="mt" aria-pressed="${muted}" aria-label="${$t('mute')}"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path class="w1" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></section>
<section class="w"><div class="rh"><h2>${$t('top')}</h2><span class="lab">${$t('onscreen')}</span></div><div class="railw"><button class="ar l" data-s="-1" aria-label="‹">‹</button><div class="rail" id="rail">${VID.map((v,i)=>`<div class="hl"><span class="num" aria-hidden="true">${fa(i+1)}</span><button class="hlc" data-v="${i}" style="background:linear-gradient(to top,#000d,#0000 62%),${grad(v[2],v[3])}"><strong>${esc(v[0])}</strong><small>${esc(v[5])}</small></button></div>`).join('')}</div><button class="ar r" data-s="1" aria-label="›">›</button></div></section>
<section class="about"><div class="ap" style="background:linear-gradient(to top,#0006,#0000),${grad(VID[0][2],VID[0][3])}"></div><div class="as"><span>${$t('logo')}</span></div><div class="ab"><h2>${$t('abT1')}<br>${$t('abT2')}</h2><p>${$t('abP')}</p><button class="b3" data-go="contact">${$t('fh')}</button></div></section>`}
 else if(view==='videos'){h='<div class="w pg"><h2>'+$t('all')+'</h2>'+(vids.length?'<div class="g">'+vids.map(([v,i])=>`<button class="vc" data-v="${i}"><div class="th" style="background:${grad(v[2],v[3])}"><b dir="ltr">${mmss(v[4])}</b></div><strong>${esc(v[0])}</strong><span class="m">${esc(v[1])}</span></button>`).join('')+'</div>':'<p class="m">'+$t('nov')+'</p>')+'</div>'}
 else if(view==='music'){h='<div class="w pg"><h2>'+$t('nMusic')+'</h2>'+(trs.length?tl(trs):'<p class="m">'+$t('non')+'</p>')+'<h2>'+$t('nPl')+'</h2>'+PLS.map(([n,ids])=>`<div class="pl"><h3>${esc(n)}</h3>${tl(ids.map(i=>[TR[i],i]))}</div>`).join('')+'</div>'}
 m.innerHTML=h;reveal();moveInk()}
function go(v){view=v;location.hash=v;render();scrollTo(0,0)}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1}):null;
let rvKey='',inkOn=false;
function reveal(){const f=view+L!==rvKey;rvKey=view+L;document.querySelectorAll('.rh,.hl,.vc,.pl,ul.l li,.about,.box,.pg h2').forEach((e,i)=>{e.classList.add('rv');if(f&&io){e.style.transitionDelay=(i%7)*70+'ms';io.observe(e)}else{e.style.transition='none';e.classList.add('in')}})}
function moveInk(){const n=$('nav'),b=n.querySelector('[aria-current=page]'),k=n.querySelector('.ink');if(!b||!k)return;k.style.transition=inkOn?'':'none';k.style.left=(b.offsetLeft-8)+'px';k.style.width=(b.offsetWidth+16)+'px';k.style.opacity=1;if(!inkOn)requestAnimationFrame(()=>requestAnimationFrame(()=>inkOn=true))}
addEventListener('resize',moveInk);if(document.fonts)document.fonts.ready.then(moveInk);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#gt').onclick=()=>go('contact');
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['home','videos','music','contact'].includes(v)){view=v;render()}});
$('#q').oninput=e=>{qs=e.target.value;if(qs&&!['videos','music'].includes(view)){view='videos';location.hash='videos'}render()};
$('#main').onclick=e=>{const t=e.target.closest('[data-t]'),v=e.target.closest('[data-v]'),g=e.target.closest('[data-go]'),a=e.target.closest('[data-s]'),mt=e.target.closest('#mt');
 if(t)play(+t.dataset.t);else if(v)openV(+v.dataset.v);else if(g)go(g.dataset.go);else if(a)$('#rail').scrollBy({left:a.dataset.s*320,behavior:'smooth'});
 else if(mt){muted=!muted;if(gn)gn.gain.value=muted?0:.03;mt.setAttribute('aria-pressed',muted)}};

/* music */
let muted=false,gn=null;
function tone(){stopTone();try{ac=ac||new AudioContext();osc=ac.createOscillator();const g=ac.createGain();g.gain.value=muted?0:.03;gn=g;osc.type='triangle';const base=[220,196,247,205][cur]||220,sc=[0,3,7,10,12];let k=0;osc.frequency.value=base;osc._t=setInterval(()=>{osc.frequency.value=base*2**(sc[k++%5]/12)},500);osc.connect(g).connect(ac.destination);osc.start()}catch(e){}}
function stopTone(){if(osc){clearInterval(osc._t);try{osc.stop()}catch(e){}osc=null}}
function play(i){if(i<0)i=TR.length-1;if(i>=TR.length)i=0;if(i!==cur){cur=i;el=0}playing=true;tone();tick();bar();render()}
function pause(){playing=false;stopTone();clearInterval(tm);bar();render()}
function tick(){clearInterval(tm);tm=setInterval(()=>{el++;if(el>=TR[cur][1]){el=0;play(cur+1)}else bar()},1000)}
function bar(){const t=TR[cur];$('#bt').textContent=t?t[0]:$t('nowNone');$('#bc').style.background=t?grad(TR[cur][2],TR[cur][2]+60):'var(--card)';const pc=t?el/t[1]*100:0;$('#bp').value=pc;$('#bp').style.setProperty('--p',pc+'%');$('#bar').hidden=cur<0;$('#bar').classList.toggle('on',playing);document.body.classList.toggle('hasbar',cur>=0);$('#btm').textContent=t?mmss(el)+' / '+mmss(t[1]):'0:00';const b=$('#bb');b.textContent=playing?'❚❚':'▶';b.setAttribute('aria-label',playing?$t('pause'):$t('play'))}
$('#bb').onclick=()=>playing?pause():play(cur<0?0:cur);
$('#bn').onclick=()=>play(cur<0?0:cur-1);$('#bx').onclick=()=>play(cur+1);
$('#bp').oninput=e=>{if(cur>=0)el=Math.floor(e.target.value/100*TR[cur][1]);bar()};

/* video modal (demo player) */
function vbar(){const v=VID[vi],pc=vel/v[4]*100;$('#vp').value=pc;$('#vp').style.setProperty('--p',pc+'%');$('#vm').textContent=mmss(vel)+' / '+mmss(v[4]);const b=$('#vb');b.textContent=vtm?'⏸':'▶';b.setAttribute('aria-label',vtm?$t('pause'):$t('play'))}
function openV(i){pause();vi=i;vel=0;const v=VID[i];$('#vt').textContent=v[0];$('#vs').style.background=grad(v[2],v[3]);vbar();$('#vd').showModal()}
function vplay(){if(vtm){clearInterval(vtm);vtm=null}else vtm=setInterval(()=>{vel++;if(vel>=VID[vi][4]){vel=0;clearInterval(vtm);vtm=null}vbar()},1000);vbar()}
$('#vb').onclick=vplay;
$('#vp').oninput=e=>{vel=Math.floor(e.target.value/100*VID[vi][4]);vbar()};
$('#vx').onclick=()=>$('#vd').close();
$('#vd').onclose=()=>{clearInterval(vtm);vtm=null};

/* theme */
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}}
try{const t=localStorage.getItem('th');if(t)theme(t)}catch(e){}

/* shared data */
let db=null,me={name:'',id:null,isOwner:false},msgs=[],lastSend=0;
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function chat(){const c=$('#cl');const bottom=c.scrollHeight-c.scrollTop-c.clientHeight<60;
 c.innerHTML=msgs.length?msgs.map(m=>`<div class="msg"><small>${esc(m.author)} · ${new Date(m.ts).toLocaleTimeString(L,{hour:'2-digit',minute:'2-digit'})}</small><div>${esc(m.text)}</div>${me.isOwner&&db?`<button data-d="${esc(m.id)}">${$t('del_')}</button>`:''}</div>`).join(''):'<p class="m">'+$t('nomsg')+'</p>';
 if(bottom)c.scrollTop=c.scrollHeight}
$('#cl').onclick=async e=>{const d=e.target.dataset.d;if(d&&db)try{await db.collection('messages').doc(d).delete()}catch(x){}};
async function send(){const t=$('#ci').value.trim();if(!t)return;if(Date.now()-lastSend<2000){$('#cn').textContent=$t('wait');return}
 lastSend=Date.now();$('#cn').textContent='';const m={text:t.slice(0,300),author:me.name||$t('guest'),ts:Date.now()};$('#ci').value='';
 if(db){try{await db.collection('messages').doc(rid()).set(m)}catch(x){$('#cn').textContent=$t('sendfail')}}else{msgs.push({...m,id:rid()});chat();$('#cl').scrollTop=1e9}}
$('#cs').onclick=send;$('#ci').onkeydown=e=>e.key==='Enter'&&send();

/* form */
$('#f').onsubmit=async e=>{e.preventDefault();
 const n=$('#fn').value.trim(),em=$('#fe').value.trim(),k=$('#fk').value,m=$('#fm').value.trim();
 $('#en').textContent=n?'':$t('eName');
 $('#ee').textContent=/^\S+@\S+\.\S+$/.test(em)?'':$t('eMail');
 $('#em').textContent=m.length>=10?'':$t('eMsg');
 if(!n||!/^\S+@\S+\.\S+$/.test(em)||m.length<10)return;
 const s=$('#fs');
 if(!db||!me.id){s.textContent=$t('login');return}
 try{await db.collection('requests').doc(me.id).set({name:n,email:em,kind:k,message:m,ts:Date.now()});s.textContent=$t('sent');e.target.reset();setTimeout(()=>s.textContent='',4000)}
 catch(x){s.textContent=$t('fail')}};

function setLang(l){L=l;try{localStorage.setItem('lg',l)}catch(e){}
 const d=document.documentElement;d.lang=l;d.dir=l==='fa'?'rtl':'ltr';build();
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=$t(e.dataset.i));
 document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=$t(e.dataset.p));
 document.querySelectorAll('[data-a]').forEach(e=>e.setAttribute('aria-label',$t(e.dataset.a)));
 document.title=$t('logo');$('#lg').textContent=l==='fa'?'EN':'فارسی';$('#lg').setAttribute('aria-label','Language / زبان');
 $('#fy').textContent='© '+new Intl.DateTimeFormat(l==='fa'?'fa-IR':'en',{year:'numeric'}).format(new Date())+' '+$t('logo');
 if(!me.name)$('#av').textContent=$t('logo')[0];
 render();bar();chat()}
$('#lg').onclick=()=>setLang(L==='fa'?'en':'fa');
setLang(L);
(async()=>{try{
 const u=await claude.use('user'),d=await claude.use('db');
 if(u){const v=await u.me();me={name:v.name||'',id:v.id,isOwner:v.isOwner};if(me.name)$('#av').textContent=me.name[0]}
 if(d){db=d;$('#cn').textContent='';d.collection('messages').orderBy('ts','desc').limit(100).onSnapshot(s=>{msgs=s.docs.map(x=>({id:x.id,...x.data()})).reverse();chat()},()=>{})}
 else $('#cn').textContent=$t('offline');
}catch(e){$('#cn').textContent=$t('offline')}})();
</script>
</body>
</html>
